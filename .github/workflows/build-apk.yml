name: Compilar APKs de IAHAKER

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependencias y Capacitor
      run: |
        npm install
        npx cap init IAHAKER.AI com.iahaker.ai --web-dir public --force
        npx cap add android

    - name: Compilar APK de Android
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: IAHAKER-App-Debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
