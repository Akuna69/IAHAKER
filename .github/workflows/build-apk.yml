name: Compilar Dos APKs de IAHAKER (Admin y Usuario)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js (Versión 22)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Configurar Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # --- 1. CONSTRUIR APK DE ADMINISTRACIÓN ---
    - name: Construir APK Admin
      run: |
        mkdir -p admin-project/public
        cp admin.html admin-project/public/index.html
        cd admin-project
        cat << 'PKG' > package.json
        {
          "name": "iahaker-admin",
          "private": true,
          "dependencies": {
            "@capacitor/core": "^7.0.0",
            "@capacitor/android": "^7.0.0"
          }
        }
        PKG
        npm install --save-exact
        npx --yes @capacitor/cli@latest init IAHAKER.Admin com.iahaker.admin --web-dir public
        npx --yes @capacitor/cli@latest add android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # --- 2. CONSTRUIR APK DE USUARIOS ---
    - name: Construir APK Usuario
      run: |
        mkdir -p user-project/public
        cp user.html user-project/public/index.html
        cd user-project
        cat << 'PKG' > package.json
        {
          "name": "iahaker-user",
          "private": true,
          "dependencies": {
            "@capacitor/core": "^7.0.0",
            "@capacitor/android": "^7.0.0"
          }
        }
        PKG
        npm install --save-exact
        npx --yes @capacitor/cli@latest init IAHAKER.User com.iahaker.user --web-dir public
        npx --yes @capacitor/cli@latest add android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # --- 3. SUBIR AMBOS APKs GENERADOS ---
    - name: Subir APKs Generados
      uses: actions/upload-artifact@v4
      with:
        name: IAHAKER-APKs-Independientes
        path: |
          admin-project/android/app/build/outputs/apk/debug/app-debug.apk
          user-project/android/app/build/outputs/apk/debug/app-debug.apk
