<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAHAKER ADMIN - SYSTEM CRITICAL</title>
    <style>
        body { background-color: #030305; color: #ff3333; font-family: monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
        header { border-bottom: 1px solid #ff3333; padding-bottom: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        h1 { color: #ff3333; font-size: 13px; margin: 0; text-shadow: 0 0 8px rgba(255, 51, 51, 0.6); }
        .container { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; max-width: 400px; margin: auto; width: 100%; }
        .card { background: #07070b; border: 1px solid #ff3333; border-radius: 4px; padding: 15px; box-shadow: inset 0 0 15px rgba(255, 51, 51, 0.15); position: relative; }
        .card::before { content: "SYSTEM FAILURE - CODE: 0x00000404"; display: block; font-size: 9px; color: #777; margin-bottom: 8px; border-bottom: 1px dashed #333; padding-bottom: 4px; }
        .card h3 { color: #ff5555; margin-top: 0; text-align: center; font-size: 13px; letter-spacing: 1px; }
        input { width: 100%; background: #000; border: 1px solid #ff3333; color: #fff; padding: 8px; border-radius: 4px; margin-bottom: 10px; box-sizing: border-box; outline: none; font-family: monospace; font-size: 12px; }
        button { width: 100%; background: #7f0000; color: white; border: 1px solid #ff3333; padding: 9px; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: monospace; text-shadow: 0 0 5px #000; }
        button:hover { background: #b30000; }
        .admin-panel { display: none; }
        .user-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1a0000; font-size: 11px; color: #ccc; }
        .warning-text { font-size: 10px; color: #888; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>
    <header>
        <h1>⚠️ ACCESS DENIED // 404</h1>
        <span id="status-badge" style="color: #ff3333; font-size: 10px;">● ROOT LOCKED</span>
    </header>

    <!-- PANTALLA DE ACCESO RESTRINGIDO -->
    <div id="login-screen" class="container">
        <div class="card">
            <h3>REALITY NOT FOUND</h3>
            <p class="warning-text">PLEASE REBOOT EXISTENCE. ENTER CREDENTIALS:</p>
            <br>
            <input type="text" id="adminUser" placeholder="USER: Xirox" autocomplete="off">
            <input type="password" id="adminPass" placeholder="PASSWORD: @Yerandys" autocomplete="off">
            <button onclick="verifyAdmin()">BYPASS SECURITY</button>
        </div>
    </div>

    <!-- PANEL DE ADMINISTRACIÓN ROOT -->
    <div id="admin-panel" class="container admin-panel" style="max-width: 100%; justify-content: flex-start;">
        <div class="card" style="max-width: 450px; margin: auto; width: 100%;">
            <h3>CORE SYSTEM GRANTED</h3>
            <p style="font-size: 12px; color: #00ff66;"><strong>Status:</strong> Root Access Active (Xirox)</p>
            <div id="user-list">
                <div class="user-row"><span>Xirox (Cuba)</span> <span style="color: #ff3333;">[ADMIN ROOT]</span></div>
            </div>
            <br>
            <button onclick="lockPanel()" style="background: #330000; border-color: #660000; color: #ff6666;">LOCK SYSTEM</button>
        </div>
    </div>

    <script>
        function verifyAdmin() {
            const u = document.getElementById('adminUser').value.trim().toLowerCase();
            const p = document.getElementById('adminPass').value.trim();

            // Credenciales oficiales actualizadas
            if(u === "xirox" && p === "@Yerandys") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'flex';
                document.getElementById('status-badge').style.color = '#00ff66';
                document.getElementById('status-badge').innerText = '● ROOT ACTIVE';
                document.getElementById('adminUser').value = '';
                document.getElementById('adminPass').value = '';
            } else {
                alert("ACCESS DENIED. INVALID CREDENTIALS.");
            }
        }

        function lockPanel() {
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('status-badge').style.color = '#ff3333';
            document.getElementById('status-badge').innerText = '● ROOT LOCKED';
        }
    </script>
</body>
</html>
