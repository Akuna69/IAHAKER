<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAHAKER ADMIN - Direct Access</title>
    <style>
        body { background-color: #030305; color: #ff3333; font-family: monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        header { border-bottom: 1px solid #ff3333; padding-bottom: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #ff3333; font-size: 15px; margin: 0; text-shadow: 0 0 8px rgba(255, 51, 51, 0.6); }
        .card { background: #07070b; border: 1px solid #ff3333; border-radius: 6px; padding: 15px; margin-bottom: 12px; box-shadow: inset 0 0 15px rgba(255, 51, 51, 0.1); }
        .card h3 { color: #ff5555; margin-top: 0; border-bottom: 1px dashed #330000; padding-bottom: 6px; font-size: 13px; }
        .user-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1a0000; font-size: 12px; color: #ccc; }
        button { background: #7f0000; color: white; border: 1px solid #ff3333; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: monospace; }
    </style>
</head>
<body>
    <header>
        <h1>🛡️ IAHAKER ADMIN ROOT</h1>
        <span style="color: #00ff66; font-size: 11px;">● Acceso Libre Autorizado</span>
    </header>

    <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
        <div class="card">
            <h3>Estado del Sistema Root</h3>
            <p><strong>Administrador:</strong> Xirox (yerandysff@gmail.com)</p>
            <p><strong>Nivel de Seguridad:</strong> Acceso Total Ilimitado 24/7</p>
        </div>

        <div class="card">
            <h3>Control y Gestión de Usuarios</h3>
            <div id="admin-user-list">
                <div class="user-row"><span>Xirox (Cuba)</span> <span style="color: #ff3333;">[ADMIN ROOT]</span></div>
            </div>
            <br>
            <button onclick="addNewUser()">+ Registrar Nuevo Usuario</button>
        </div>
    </div>

    <script>
        let dbUsers = JSON.parse(localStorage.getItem('iahaker_users')) || [{ name: "Xirox", email: "yerandysff@gmail.com", plan: "admin" }];
        function renderAdminUsers() {
            const container = document.getElementById('admin-user-list');
            container.innerHTML = dbUsers.map(u => `<div class="user-row"><span>${u.name} (${u.email})</span> <span style="color: #ff3333;">[${u.plan.toUpperCase()}]</span></div>`).join('');
        }
        function addNewUser() {
            let name = prompt("Nombre del usuario:");
            let email = prompt("Correo electrónico:");
            if(name && email) {
                dbUsers.push({ name, email, plan: "cliente" });
                localStorage.setItem('iahaker_users', JSON.stringify(dbUsers));
                renderAdminUsers();
                alert("Usuario añadido correctamente.");
            }
        }
        renderAdminUsers();
    </script>
</body>
</html>
