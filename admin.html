<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAHAKER.COM - Admin Portal</title>
    <style>
        body { background-color: #050508; color: #e1e1e6; font-family: system-ui, -apple-system, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; box-sizing: border-box; }
        .auth-card { background: #0b0c10; border: 1px solid #7c3aed; border-radius: 12px; padding: 25px; width: 320px; box-shadow: 0 0 20px rgba(124, 58, 237, 0.2); text-align: center; }
        h2 { color: #a78bfa; margin-top: 0; margin-bottom: 20px; font-size: 18px; letter-spacing: 1px; }
        .tabs { display: flex; margin-bottom: 20px; background: #151821; border-radius: 6px; padding: 3px; }
        .tab { flex: 1; background: transparent; border: none; color: #a1a1aa; padding: 8px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .tab.active { background: #7c3aed; color: white; }
        input { width: 100%; background: #000; border: 1px solid #3f3f46; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 12px; box-sizing: border-box; outline: none; font-size: 13px; }
        .btn-submit { width: 100%; background: #7c3aed; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 5px; }
        .admin-dashboard { display: none; text-align: left; width: 100%; max-width: 400px; background: #0b0c10; border: 1px solid #7c3aed; border-radius: 12px; padding: 20px; }
        .user-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1f2231; font-size: 12px; }
    </style>
</head>
<body>

    <!-- TARJETA DE LOGIN IGUAL A LA WEB -->
    <div id="authCard" class="auth-card">
        <h2>IAHAKER.COM</h2>
        <div class="tabs">
            <button class="tab" onclick="switchTab('register')">Registrarse</button>
            <button class="tab active" onclick="switchTab('login')">Iniciar Sesión</button>
        </div>
        <input type="email" id="emailInput" placeholder="yerandysff@gmail.com" value="yerandysff@gmail.com">
        <input type="password" id="passInput" placeholder="Contraseña" value="@Yerandys">
        <button class="btn-submit" onclick="handleLogin()">Entrar al Sistema</button>
    </div>

    <!-- PANEL DE ADMINISTRACIÓN -->
    <div id="adminDashboard" class="admin-dashboard">
        <h2 style="border-bottom: 1px solid #7c3aed; padding-bottom: 8px;">Panel Admin Xirox</h2>
        <p><strong>Estado:</strong> Acceso Ilimitado 24/7</p>
        <p><strong>Correo Root:</strong> yerandysff@gmail.com</p>
        <div style="margin: 15px 0;">
            <strong>Usuarios Registrados:</strong>
            <div id="userList" style="margin-top: 8px;">
                <div class="user-row"><span>Xirox (Cuba)</span> <span style="color: #a78bfa;">[ADMIN]</span></div>
            </div>
        </div>
        <button class="btn-submit" onclick="logout()" style="background: #ef4444; margin-top: 10px;">Cerrar Sesión</button>
    </div>

    <script>
        function switchTab(tab) {
            if(tab === 'register') {
                alert("Modo Registro restringido en la app de administración.");
            }
        }

        function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();

            // Validación directa con tus credenciales exactas
            if(email === "yerandysff@gmail.com" && pass === "@Yerandys") {
                document.getElementById('authCard').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
            } else {
                alert("Credenciales inválidas. Acceso denegado.");
            }
        }

        function logout() {
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('authCard').style.display = 'block';
            document.getElementById('passInput').value = '';
        }
    </script>
</body>
</html>
