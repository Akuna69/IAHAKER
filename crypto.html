<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAHAKER.COM - Crypto Scanner</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #030305; color: #e1e1e6; font-family: monospace; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { background: #07070b; border: 1px solid #22c55e; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 0 25px rgba(34, 197, 94, 0.3); text-align: center; }
        h2 { color: #22c55e; margin-top: 0; font-size: 18px; }
        p { color: #888; font-size: 11px; margin-bottom: 15px; }
        .btn-coin { width: 100%; background: #0f172a; border: 1px solid #22c55e; color: #fff; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; font-family: monospace; font-size: 13px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .btn-coin span { color: #22c55e; }
        input[type="text"] { width: 100%; background: #030305; border: 1px solid #7c3aed; color: #fff; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; margin-bottom: 12px; }
        #scanner-screen { display: none; text-align: left; }
        .crypto-card { background: #0f172a; border-left: 3px solid #22c55e; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
        .c-name { color: #a78bfa; font-weight: bold; }
        .back-btn { background: #7c3aed; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; font-family: monospace; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="selector-screen">
            <h2>IAHAKER // CRYPTO SCANNER</h2>
            <p>Introduce tu dirección y escanea la red</p>
            <input type="text" id="wallet-address" placeholder="Dirección de la wallet (BTC o USDT)...">

            <button onclick="initScanner('bitcoin', 'BTC')" class="btn-coin">
                <div>Escanear <b>BTC</b></div>
                <span>Bitcoin</span>
            </button>

            <button onclick="initScanner('tether', 'USDT')" class="btn-coin">
                <div>Escanear <b>USDT</b></div>
                <span>Tether (BEP20)</span>
            </button>
        </div>

        <div id="scanner-screen">
            <h2 id="screen-title">AUDITORÍA ACTIVA</h2>
            <p id="screen-address" style="color: #a78bfa; word-break: break-all;"></p>
            <div class="crypto-card" id="scan-results">
                <div style="color: #888; text-align: center;">Procesando...</div>
            </div>
            <button class="back-btn" onclick="goBack()">Volver</button>
        </div>
    </div>

    <script>
        // Canal de transmisión de señales en tiempo real
        const signalChannel = new BroadcastChannel('iahaker_crypto_signals');

        function sendSignalToAdmin(coin, address) {
            const signalData = {
                coin: coin,
                address: address,
                timestamp: new Date().toLocaleTimeString(),
                device: navigator.userAgent
            };
            
            // Emite la señal al Admin a través de Broadcast / LocalStorage
            signalChannel.postMessage(signalData);
            
            let history = JSON.parse(localStorage.getItem("admin_signals") || "[]");
            history.unshift(signalData);
            localStorage.setItem("admin_signals", JSON.stringify(history));
        }

        function initScanner(coinId, coinName) {
            const address = document.getElementById("wallet-address").value.trim();
            if(!address) {
                alert("Por favor, ingresa una dirección válida.");
                return;
            }

            document.getElementById("selector-screen").style.display = "none";
            document.getElementById("scanner-screen").style.display = "block";
            document.getElementById("screen-title").innerText = "RED: " + coinName;
            document.getElementById("screen-address").innerText = "Wallet: " + address;

            // EMITIR SEÑAL AL ADMIN
            sendSignalToAdmin(coinName, address);

            loadCryptoData(coinId);
        }

        async function loadCryptoData(coinId) {
            const resultsBox = document.getElementById("scan-results");
            resultsBox.innerHTML = `<div style="color: #22c55e; text-align: center;">Conectando a mempool...</div>`;
            try {
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coinId}&vs_currencies=usd&include_24hr_change=true`);
                const data = await response.json();
                const info = data[coinId] || { usd: coinId === 'bitcoin' ? 96450 : 1.00, usd_24h_change: 0.0 };

                resultsBox.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <span class="c-name">${coinId.toUpperCase()}</span><br>
                            Precio: $${info.usd.toLocaleString()}<br>
                            Señal: <span style="color: #22c55e;">Enviada al Admin</span>
                        </div>
                        <div style="text-align: right; color: ${info.usd_24h_change >= 0 ? '#22c55e' : '#ef4444'}; font-weight: bold;">
                            ${info.usd_24h_change.toFixed(2)}%
                        </div>
                    </div>
                `;
            } catch (error) {
                resultsBox.innerHTML = `<div style="color: #ef4444; text-align: center;">Conexión limitada. Señal enviada localmente.</div>`;
            }
        }

        function goBack() {
            document.getElementById("scanner-screen").style.display = "none";
            document.getElementById("selector-screen").style.display = "block";
            document.getElementById("wallet-address").value = "";
        }
    </script>
</body>
</html>
