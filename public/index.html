<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAHAKER.COM</title>
    <style>
        body { background-color: #0d0e15; color: #e1e1e6; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #161822; padding: 15px; text-align: center; border-bottom: 2px solid #7c3aed; font-weight: bold; color: #a78bfa; display: flex; justify-content: space-between; align-items: center; padding-left: 20px; padding-right: 20px;}
        #auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 14, 21, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: #161822; border: 1px solid #7c3aed; padding: 25px; border-radius: 10px; width: 320px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 20px rgba(124, 58, 237, 0.3); }
        .auth-card h2 { color: #a78bfa; text-align: center; margin-top: 0; margin-bottom: 5px; }
        .auth-card input, .auth-card select { background: #09090b; border: 1px solid #3f3f46; color: #e1e1e6; padding: 10px; border-radius: 6px; outline: none; font-family: monospace; width: 100%; box-sizing: border-box; }
        .btn-main { background: #7c3aed; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-family: monospace; }
        .tab-buttons { display: flex; gap: 8px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px; background: #09090b; border: 1px solid #3f3f46; color: #a1a1aa; border-radius: 6px; cursor: pointer; font-family: monospace; font-weight: bold; font-size: 12px; }
        .tab-btn.active { background: #7c3aed; color: white; border-color: #7c3aed; }
        #main-container { display: flex; flex: 1; overflow: hidden; display: none; }
        #chat-section { flex: 2; display: flex; flex-direction: column; border-right: 1px solid #27272a; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        #pricing-section { flex: 1; padding: 20px; background: #12131c; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 15px; border-radius: 8px; max-width: 85%; line-height: 1.4; word-break: break-word; }
        .user { background: #7c3aed; color: white; align-self: flex-end; }
        .bot { background: #1f2231; color: #f4f4f5; align-self: flex-start; border: 1px solid #3f3f46; }
        .input-area { display: flex; padding: 10px; background: #161822; border-top: 1px solid #27272a; }
        .input-area input { flex: 1; background: #09090b; border: 1px solid #3f3f46; color: #a78bfa; padding: 10px; border-radius: 6px; outline: none; font-family: monospace; }
        .input-area button { background: #7c3aed; color: white; border: none; padding: 8px 15px; margin-left: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; width: auto; }
        .card { background: #1a1b26; border: 1px solid #3f3f46; padding: 12px; border-radius: 8px; }
        .card h3 { color: #a78bfa; margin-top: 0; margin-bottom: 5px; }
        .price { color: #22c55e; font-weight: bold; }
        
        /* Terminal de Kali Linux */
        #kali-terminal { background: #050508; border: 1px solid #7c3aed; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; height: 240px; box-shadow: inset 0 0 10px rgba(124, 58, 237, 0.2); margin-top: 10px; }
        #kali-output { flex: 1; overflow-y: auto; font-size: 11px; color: #22c55e; display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; word-break: break-all; }
        .kali-prompt-line { display: flex; align-items: center; gap: 6px; border-top: 1px solid #1f2231; padding-top: 6px; }
        .kali-prompt-line span { color: #ef4444; font-weight: bold; font-size: 11px; }
        .kali-prompt-line input { background: transparent; border: none; color: #e1e1e6; font-family: monospace; outline: none; flex: 1; font-size: 11px; }
    </style>
</head>
<body>
    <div id="auth-modal">
        <div class="auth-card">
            <h2>IAHAKER.COM</h2>
            <div class="tab-buttons">
                <button id="btnTabReg" class="tab-btn active" onclick="switchMode('register')">Registrarse</button>
                <button id="btnTabLog" class="tab-btn" onclick="switchMode('login')">Iniciar Sesión</button>
            </div>

            <div id="formRegister" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="regUser" placeholder="Nombre de usuario">
                <input type="email" id="regEmail" placeholder="Correo electrónico">
                <input type="password" id="regPass" placeholder="Contraseña">
                <select id="regCountry">
                    <option value="" disabled selected>Selecciona tu país</option>
                </select>
                <button class="btn-main" onclick="handleRegister()">Crear Cuenta</button>
            </div>

            <div id="formLogin" style="display: none; flex-direction: column; gap: 10px;">
                <input type="email" id="logEmail" placeholder="Correo electrónico" value="yerandysff@gmail.com">
                <input type="password" id="logPass" placeholder="Contraseña" value="@Yerandys">
                <button class="btn-main" onclick="handleLogin()">Entrar al Sistema</button>
            </div>
        </div>
    </div>

    <header>
        <span id="headerTitle">KALI >$ IAHAKER.COM</span>
        <span id="userStatus" style="font-size: 12px; color: #22c55e;">Modo: Simple</span>
    </header>
    
    <div id="main-container">
        <div id="chat-section">
            <div id="chat-container">
                <div class="message bot">¡Bienvenido a IAHAKER.COM! Sistema activo globalmente 24/7.</div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Escribe un comando o mensaje..." autofocus>
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>

        <div id="pricing-section">
            <!-- Sección de Planes en USDT para usuarios normales -->
            <div id="userPlansContainer">
                <div class="card">
                    <h3>Sistema Simple</h3>
                    <p>• 15 mensajes de prueba</p>
                    <p class="price">Gratis (0 USDT)</p>
                </div>
                <div class="card" style="border-color: #3b82f6; margin-top: 10px;">
                    <h3>Modo Hacker</h3>
                    <p>• 100 mensajes al mes</p>
                    <p class="price">5.00 USDT / mes</p>
                    <button style="background: #3b82f6; width:100%; border:none; padding:8px; border-radius:6px; color:white; font-weight:bold; cursor:pointer; margin-top:8px;" onclick="requestPlan('hacker')">Adquirir Modo Hacker</button>
                </div>
                <div class="card" style="border-color: #22c55e; margin-top: 10px;">
                    <h3>Modo Sin Límites</h3>
                    <p>• Uso 100% ilimitado</p>
                    <p class="price">15.00 USDT / mes</p>
                    <button style="background: #22c55e; width:100%; border:none; padding:8px; border-radius:6px; color:white; font-weight:bold; cursor:pointer; margin-top:8px;" onclick="requestPlan('unlimited')">Adquirir Sin Límites</button>
                </div>
                <div id="paymentBox" class="card" style="display:none; border-color: #7c3aed; background: #161722; margin-top: 10px;">
                    <h3 id="paymentTitle">Pago con USDT</h3>
                    <p id="walletInfo" style="word-break: break-all; font-size: 11px; background: #09090b; padding: 8px;"></p>
                    <input type="text" id="txHashInput" placeholder="Pega el Hash de la transacción" style="width:100%; margin-top:5px; box-sizing: border-box; background:#09090b; border:1px solid #3f3f46; color:#e1e1e6; padding:8px; border-radius:6px;">
                    <button style="background:#7c3aed; width:100%; border:none; padding:8px; border-radius:6px; color:white; font-weight:bold; cursor:pointer; margin-top:8px;" onclick="verifyPayment()">Verificar y Activar</button>
                </div>
            </div>

            <!-- Panel Admin con Terminal de Kali Linux (Solo visible para Xirox) -->
            <div id="adminPanelContainer"></div>
        </div>
    </div>

    <script>
        let currentUser = { name: '', isAdmin: false, plan: 'simple' };
        let activePlanKey = 'simple';
        const countries = ["Afganistán", "Albania", "Alemania", "Andorra", "Angola", "Antigua y Barbuda", "Arabia Saudita", "Argelia", "Argentina", "Armenia", "Australia", "Austria", "Azerbaiyán", "Bahamas", "Bangladés", "Barbados", "Baréin", "Bélgica", "Belice", "Benin", "Bielorrusia", "Bolivia", "Bosnia-Herzegovina", "Botsuana", "Brasil", "Brunéi", "Bulgaria", "Burkina Faso", "Burundi", "Cabo Verde", "Camboya", "Camerún", "Canadá", "Catar", "Chad", "Chile", "China", "Chipre", "Colombia", "Comoras", "Congo", "Corea del Norte", "Corea del Sur", "Costa de Marfil", "Costa Rica", "Croacia", "Cuba", "Dinamarca", "Ecuador", "Egipto", "El Salvador", "Emiratos Árabes Unidos", "Eritrea", "Eslovaquia", "Eslovenia", "España", "Estados Unidos", "Estonia", "Etiopía", "Filipinas", "Finlandia", "Fiyi", "Francia", "Gabón", "Gambia", "Georgia", "Ghana", "Grecia", "Guatemala", "Guinea", "Haití", "Honduras", "Hungría", "India", "Indonesia", "Irak", "Irán", "Irlanda", "Islandia", "Israel", "Italia", "Jamaica", "Japón", "Jordania", "Kazajistán", "Kenia", "Kuwait", "Laos", "Letonia", "Líbano", "Libia", "Lituania", "Luxemburgo", "Madagascar", "Malasia", "Malawi", "Maldivas", "Malí", "Malta", "Marruecos", "Mauricio", "Mauritania", "México", "Moldavia", "Mónaco", "Mongolia", "Montenegro", "Mozambique", "Namibia", "Nepal", "Nicaragua", "Níger", "Nigeria", "Noruega", "Nueva Zelanda", "Omán", "Países Bajos", "Pakistán", "Palestina", "Panamá", "Paraguay", "Perú", "Polonia", "Portugal", "Reino Unido", "República Checa", "República Dominicana", "Rumanía", "Rusia", "San Marino", "Senegal", "Serbia", "Singapur", "Siria", "Somalia", "Sri Lanka", "Sudáfrica", "Suecia", "Suiza", "Surinam", "Tailandia", "Tanzania", "Tayikistán", "Timor Oriental", "Togo", "Túnez", "Turquía", "Ucrania", "Uganda", "Uruguay", "Uzbekistán", "Vanuatu", "Venezuela", "Vietnam", "Yemen", "Yibuti", "Zambia", "Zimbabue"];
        
        const sel = document.getElementById('regCountry');
        countries.forEach(c => { let o = document.createElement('option'); o.value = c; o.innerHTML = c; sel.appendChild(o); });
        sel.value = "Cuba";

        function switchMode(mode) {
            if(mode === 'register') {
                document.getElementById('btnTabReg').classList.add('active');
                document.getElementById('btnTabLog').classList.remove('active');
                document.getElementById('formRegister').style.display = 'flex';
                document.getElementById('formLogin').style.display = 'none';
            } else {
                document.getElementById('btnTabLog').classList.add('active');
                document.getElementById('btnTabReg').classList.remove('active');
                document.getElementById('formLogin').style.display = 'flex';
                document.getElementById('formRegister').style.display = 'none';
            }
        }

        function handleRegister() {
            const user = document.getElementById('regUser').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const country = document.getElementById('regCountry').value;
            
            if(!user || !email || !pass || !country) return alert('Rellena todos los campos.');
            currentUser.name = user;
            if(email === 'yerandysff@gmail.com' && pass === '@Yerandys') {
                setAdminMode();
            } else {
                currentUser.isAdmin = false;
                currentUser.plan = 'simple';
                openAppSession();
            }
        }

        function handleLogin() {
            const email = document.getElementById('logEmail').value.trim();
            const pass = document.getElementById('logPass').value.trim();
            if(!email || !pass) return alert('Introduce correo y contraseña.');

            if(email === 'yerandysff@gmail.com' && pass === '@Yerandys') {
                currentUser.name = "Xirox";
                setAdminMode();
            } else {
                currentUser.name = email.split('@')[0];
                currentUser.isAdmin = false;
                currentUser.plan = 'simple';
                openAppSession();
            }
        }

        function setAdminMode() {
            currentUser.isAdmin = true;
            currentUser.plan = 'admin';
            document.getElementById('userStatus').innerText = "🛡️ ADMIN XIROX";
            document.getElementById('headerTitle').innerText = "🛡️ PANEL XIROX";
            
            // Ocultar planes normales y mostrar Terminal Kali Linux
            document.getElementById('userPlansContainer').style.display = 'none';
            document.getElementById('adminPanelContainer').innerHTML = `
                <div class="card" style="border-color:#7c3aed;">
                    <h3>Panel Admin Xirox</h3>
                    <p>Acceso Ilimitado 24/7</p>
                </div>
                <div class="card" style="border-color:#7c3aed;">
                    <h3>🛡️ Terminal Kali Linux</h3>
                    <div id="kali-terminal">
                        <div id="kali-output">
                            <div>Kali GNU/Linux Rolling [Version 2026.1]</div>
                            <div>Root Access Granted. Type 'help' for commands.</div>
                        </div>
                        <div class="kali-prompt-line">
                            <span>root@kali-iahaker:~#</span>
                            <input type="text" id="kaliInput" autofocus onkeydown="handleKaliCommand(event)">
                        </div>
                    </div>
                </div>
            `;
            openAppSession();
        }

        function handleKaliCommand(e) {
            if(e.key === 'Enter') {
                const input = document.getElementById('kaliInput');
                const cmd = input.value.trim();
                const output = document.getElementById('kali-output');
                
                output.innerHTML += `<div>root@kali-iahaker:~# ${cmd}</div>`;
                input.value = '';

                let resp = "";
                const c = cmd.toLowerCase();
                if(c === 'help') {
                    resp = "Comandos disponibles: nmap, whoami, uname -a, ifconfig, cat /etc/passwd, clear, reboot";
                } else if(c === 'whoami') {
                    resp = "root (Xirox - Superusuario)";
                } else if(c.startsWith('nmap')) {
                    resp = "Starting Nmap scan on target... Host is up (0.002s latency). Port 80/tcp OPEN, Port 443/tcp OPEN (IAHAKER.COM)";
                } else if(c === 'uname -a') {
                    resp = "Linux kali-iahaker 6.12.0-kali-amd64 #1 SMP PREEMPT_DYNAMIC Kali GNU/Linux x86_64";
                } else if(c === 'ifconfig') {
                    resp = "eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST> mtu 1500 inet 10.24.8.9 netmask 255.255.255.0 broadcast 10.24.8.255";
                } else if(c === 'cat /etc/passwd') {
                    resp = "root:x:0:0:root:/root:/bin/bash\nxirox:x:1000:1000:Xirox Admin,,,:/home/xirox:/bin/zsh";
                } else if(c === 'clear') {
                    output.innerHTML = '';
                    return;
                } else if(c === '') {
                    resp = "";
                } else {
                    resp = `bash: ${cmd}: command not found. Type 'help' for available utilities.`;
                }

                if(resp) {
                    output.innerHTML += `<div style="color: #a78bfa; white-space: pre-line;">${resp}</div>`;
                }
                output.scrollTop = output.scrollHeight;
            }
        }

        function openAppSession() {
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('main-container').style.display = 'flex';
        }

        function requestPlan(planKey) {
            activePlanKey = planKey;
            const plansData = {
                hacker: { name: "Modo Hacker", price: "5.00" },
                unlimited: { name: "Modo Sin Límites", price: "15.00" }
            };
            const p = plansData[planKey];
            document.getElementById('paymentBox').style.display = 'block';
            document.getElementById('paymentTitle').innerText = `Pagar ${p.name} (${p.price} USDT)`;
            document.getElementById('walletInfo').innerHTML = `Envía <b>${p.price} USDT</b> (BEP20):<br><b>0x1a893Dab175dBeb8Ea8d3e2115F4ECB2655397aA</b>`;
        }

        function verifyPayment() {
            const txHash = document.getElementById('txHashInput').value.trim();
            if(!txHash) return alert('Introduce el Hash de la transacción.');
            currentUser.plan = activePlanKey;
            alert('¡Pago verificado y plan activado con éxito!');
            document.getElementById('paymentBox').style.display = 'none';
            document.getElementById('userStatus').innerText = `Modo: ${activePlanKey.toUpperCase()}`;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;
            const chat = document.getElementById('chat-container');
            chat.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                let prefix = "IAHAKER [Simple]";
                if(currentUser.plan === 'hacker') prefix = "KALI >$ [MODO HACKER]";
                if(currentUser.plan === 'unlimited') prefix = "INFINITY >$ [SIN LÍMITES]";
                if(currentUser.isAdmin) prefix = "🛡️ [PANEL DE CONTROL XIROX]";

                chat.innerHTML += `<div class="message bot">${prefix} > ${currentUser.name}: "${text}" (Procesado 24/7)</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
